name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  agent-python:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pulseflow_agent
          MYSQL_USER: pulseflow_agent
          MYSQL_PASSWORD: agent_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u pulseflow_agent -pagent_test_password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Validate agent offline
        working-directory: pulseflow-agent
        env:
          PULSEFLOW_AGENT_MODEL: test
          PULSEFLOW_JAVA_BASE_URL: http://127.0.0.1:8080
          AGENT_TEST_MYSQL_URL: mysql+asyncmy://pulseflow_agent:agent_test_password@127.0.0.1:3306/pulseflow_agent
          PULSEFLOW_AGENT_EVAL_REPORT: eval-report.json
        run: |
          uv sync --locked
          uv run ruff check .
          uv run mypy src tests
          uv run pytest -q
      - name: Upload offline Agent evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: pulseflow-agent/eval-report.json
          retention-days: 7

  backend-java:
    runs-on: ubuntu-latest
    env:
      # Signals to Maven enforcer that Docker integration tests MUST run.
      # The ci-enforce-docker-tests profile in pulseflow/pom.xml will fail
      # the build if PULSEFLOW_TEST_DOCKER is not "true" in GitHub Actions.
      CI: "true"
      PULSEFLOW_TEST_DOCKER: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify (unit + integration tests)
        working-directory: pulseflow
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: pulseflow/**/target/surefire-reports/*.xml
          retention-days: 7

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: pulseflow/**/target/failsafe-reports/*.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pulseflow-web/package-lock.json

      - name: Validate frontend
        working-directory: pulseflow-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build
