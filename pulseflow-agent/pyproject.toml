[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulseflow-agent"
version = "0.1.0"
description = "PulseFlow growth investigation agent foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.30,<2",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulseflow_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pulseflow_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
