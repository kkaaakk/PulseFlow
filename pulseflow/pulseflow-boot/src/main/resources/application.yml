server:
  port: 8080

otel:
  service:
    name: pulseflow-java
  sdk:
    disabled: ${PULSEFLOW_OTEL_DISABLED:true}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: none
  logs:
    exporter: none
  propagators: tracecontext
  instrumentation:
    jdbc:
      query-sanitization:
        enabled: true

spring:
  application:
    name: pulseflow
  datasource:
    url: jdbc:mysql://localhost:3306/pulseflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 100
    listener:
      ack-mode: record
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    admin:
      # xxl-job-admin is a separate web app and must NOT share port 8080 with
      # this app. Run it on 8081 (its server.port) and point the executor here.
      addresses: http://localhost:8081/xxl-job-admin
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: pulseflow-executor
      address:
      ip:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

sa-token:
  token-name: token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

logging:
  level:
    com.pulseflow: DEBUG
    org.springframework.kafka: INFO

pulseflow:
  agent:
    service-url: ${PULSEFLOW_AGENT_SERVICE_URL:}
    # Dedicated machine secret. An empty value disables the internal API.
    internal-token: ${PULSEFLOW_AGENT_INTERNAL_TOKEN:}
  # Local web-console credentials. Disable this directory when an external
  # identity provider is wired in; passwords are environment-backed.
  auth:
    local-enabled: ${PULSEFLOW_LOCAL_AUTH_ENABLED:true}
    session-store: ${PULSEFLOW_AUTH_SESSION_STORE:memory}
    operator-id: ${PULSEFLOW_OPERATOR_ID:1024}
    operator-password: ${PULSEFLOW_OPERATOR_PASSWORD:pulseflow-local}
    operator-name: ${PULSEFLOW_OPERATOR_NAME:Operator}
    admin-id: ${PULSEFLOW_ADMIN_ID:1}
    admin-password: ${PULSEFLOW_ADMIN_PASSWORD:pulseflow-admin}
    admin-name: ${PULSEFLOW_ADMIN_NAME:Administrator}
  campaign:
    draft-ttl-hours: 24
